name: Build PvPEffects Jar

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    # Runner's preinstalled Gradle is often too old for Java 25 (needs 9.1+).
    # Best long-term fix: commit the Gradle wrapper and run ./gradlew build instead.
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.1.0'

    - name: Build with Gradle
      run: gradle build

    - name: Upload compiled plugin jar
      uses: actions/upload-artifact@v4
      with:
        name: PvPEffects-Jar
        path: build/libs/*.jar
